server {
    listen 80;
    server_name localhost;

    # -------------------------------------------------------
    # Laravel API — todas as rotas /api e /sanctum vão ao
    # PHP-FPM. O Laravel resolve tudo via public/index.php
    # -------------------------------------------------------
    location ~ ^/(api|sanctum|up)(/.*)?$ {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/public;
        fastcgi_param REQUEST_URI     $request_uri;
        fastcgi_param QUERY_STRING    $query_string;
        fastcgi_param REQUEST_METHOD  $request_method;
        fastcgi_param CONTENT_TYPE    $content_type;
        fastcgi_param CONTENT_LENGTH  $content_length;
        fastcgi_param SERVER_NAME     $server_name;
        fastcgi_param SERVER_PORT     $server_port;
        fastcgi_param SERVER_PROTOCOL $server_protocol;
        fastcgi_param HTTP_HOST       $http_host;
        fastcgi_param HTTPS           off;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST  $http_host;
        include fastcgi_params;
    }

    # Static files from Laravel public/ (favicon, etc.)
    location ~ ^/(favicon\.ico|robots\.txt|storage/.*)$ {
        root /var/www/public;
        try_files $uri =404;
        access_log off;
    }

    # -------------------------------------------------------
    # Next.js Frontend — tudo o mais
    # -------------------------------------------------------
    location / {
        resolver 127.0.0.11 valid=10s;
        set $frontend_upstream http://frontend:3000;
        proxy_pass         $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;

        # HMR websocket (Next.js dev)
        proxy_read_timeout 86400;
    }
}
