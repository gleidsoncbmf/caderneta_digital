services:
  mysql:
    image: mysql:8.0
    container_name: cardeneta_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-cardeneta}
      MYSQL_USER: ${DB_USERNAME:-cardeneta}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - cardeneta_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cardeneta_backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost,localhost:3000,127.0.0.1,127.0.0.1:3000}
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-cardeneta}
      DB_USERNAME: ${DB_USERNAME:-cardeneta}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cardeneta_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cardeneta_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
    networks:
      - cardeneta_network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: cardeneta_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./backend:/var/www
    depends_on:
      - backend
      - frontend
    networks:
      - cardeneta_network

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: cardeneta_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8181}:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: ${DB_USERNAME:-cardeneta}
      PMA_PASSWORD: ${DB_PASSWORD:-secret}
    depends_on:
      - mysql
    networks:
      - cardeneta_network

volumes:
  mysql_data:

networks:
  cardeneta_network:
    driver: bridge
